name: Compilar y Firmar AAB y APK Android (Notaly)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "flet[all]>=0.28.0" fpdf2 requests Pillow python-minifier

      - name: Ofuscar y proteger código fuente (Anti-Reversing)
        run: |
          python scripts/obfuscate_pipeline.py

      - name: Detectar versión de Flutter requerida por Flet
        id: flet-flutter
        run: |
          FLUTTER_VER=$(python -c "import flet.version; print(flet.version.flutter_version)" 2>/dev/null || echo "3.44.8")
          if [ -z "$FLUTTER_VER" ] || [ "$FLUTTER_VER" = "0" ]; then
            FLUTTER_VER="3.44.8"
          fi
          echo "version=$FLUTTER_VER" >> $GITHUB_OUTPUT
          echo "Versión de Flutter requerida por Flet detectada: $FLUTTER_VER"

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flet-flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Aceptar licencias de Android
        run: |
          mkdir -p ~/.android
          echo -e "### User Sources for Android SDK Manager\n" > ~/.android/repositories.cfg

          for license in $(ls "$ANDROID_HOME/licenses/" 2>/dev/null || true)
          do
            echo "Aceptando licencia: $license"
            echo -e "\n$license" >> "$ANDROID_HOME/licenses/android-sdk-license"
          done

          mkdir -p "$ANDROID_HOME/licenses"
          printf "%s\n" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "84831b9409646a247e4444e66496795d4ba24124" \
            "893fb8b22d8221007e1488c767e194f47d939f5b" \
            "7c027e50ab0e962452660e45f642415a832f5313" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n504667f4c0de7973335447fc6c3b7e40efee42e8" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\n1d8aae7e54b3ecb4c15a80bda3a9edbc11a0e30b" >> "$ANDROID_HOME/licenses/android-google-chrome-intel-build-tools-license"

          yes | flutter doctor --android-licenses || true

      - name: Configurar Gradle y optimizaciones JVM
        run: |
          mkdir -p ~/.gradle
          printf "%s\n" \
            "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" \
            "org.gradle.parallel=true" \
            "org.gradle.vfs.watch=false" > ~/.gradle/gradle.properties

      - name: Diagnóstico de entorno Flutter y Android
        run: |
          flutter doctor -v

      - name: Limpiar compilación previa
        run: |
          rm -rf build/flutter/build 2>/dev/null || true

      - name: Compilar AAB para Google Play Store
        env:
          FLET_CLI_NO_RICH_OUTPUT: "true"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -Dorg.gradle.parallel=true -Dorg.gradle.vfs.watch=false"
        run: |
          flet build aab . \
            --module-name mobile_app \
            --project notaly \
            --product "Notaly" \
            --org com.notaly.app \
            --build-version 2.0.0 \
            --compile-app \
            --cleanup-app \
            --yes \
            --no-rich-output \
            -vv \
            --flutter-build-args=--verbose

      - name: Limpiar build intermedio para APK
        run: |
          rm -rf build/flutter/build 2>/dev/null || true

      - name: Compilar APK para pruebas directas
        env:
          FLET_CLI_NO_RICH_OUTPUT: "true"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -Dorg.gradle.parallel=true -Dorg.gradle.vfs.watch=false"
        run: |
          flet build apk . \
            --module-name mobile_app \
            --project notaly \
            --product "Notaly" \
            --org com.notaly.app \
            --build-version 2.0.0 \
            --compile-app \
            --cleanup-app \
            --yes \
            --no-rich-output \
            -vv \
            --flutter-build-args=--verbose

      - name: Verificar binarios generados
        run: |
          echo "=== Archivos AAB generados ==="
          find build/aab -name "*.aab" -type f || true
          echo "=== Archivos APK generados ==="
          find build/apk -name "*.apk" -type f || true

      - name: Firmar binarios (si hay secrets configurados)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No hay keystore configurado en secrets; se generan sin firmar de producción."
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          # Firmar APKs con apksigner
          if [ -n "$APKSIGNER" ]; then
            for apk in build/apk/*.apk; do
              if [ -f "$apk" ] && [[ "$apk" != *"-signed.apk" ]]; then
                "$APKSIGNER" sign \
                  --ks release.keystore \
                  --ks-pass "pass:$KEYSTORE_PASSWORD" \
                  --ks-key-alias "$KEY_ALIAS" \
                  --key-pass "pass:$KEY_PASSWORD" \
                  --out "${apk%.apk}-signed.apk" "$apk"
                rm -f "$apk"
              fi
            done
          fi

          # Firmar AABs con jarsigner
          for aab in build/aab/*.aab; do
            if [ -f "$aab" ] && [[ "$aab" != *"-signed.aab" ]]; then
              jarsigner \
                -keystore release.keystore \
                -storepass "$KEYSTORE_PASSWORD" \
                -keypass "$KEY_PASSWORD" \
                "$aab" "$KEY_ALIAS"
              mv "$aab" "${aab%.aab}-signed.aab"
            fi
          done

          rm -f release.keystore

      - name: Subir AAB para Google Play Store
        uses: actions/upload-artifact@v4
        with:
          name: Notaly-GooglePlay-AAB
          path: build/aab/*
          retention-days: 30

      - name: Subir APK para pruebas en dispositivos
        uses: actions/upload-artifact@v4
        with:
          name: Notaly-Android-APK
          path: build/apk/*
          retention-days: 30