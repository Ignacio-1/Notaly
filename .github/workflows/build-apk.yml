name: Compilar y Firmar APK Android (Notaly)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Liberar espacio en disco (Maximo ~70GB libres)
        run: |
          echo "Espacio antes de la limpieza:"
          df -h /
          
          # Detener docker y eliminar todas las imagenes cacheadas (~30 GB)
          sudo systemctl stop docker || true
          sudo rm -rf /var/lib/docker
          
          # Eliminar frameworks no utilizados (~35 GB)
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/julia
          
          # Eliminar solo imagenes pesadas de emuladores Android (~10 GB, manteniendo SDK intacto)
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          
          # Limpiar caches del sistema
          sudo apt-get clean
          sudo apt-get autoclean
          sudo apt-get autoremove -y
          sudo rm -rf /var/log/*
          
          echo "Espacio disponible despues de la limpieza:"
          df -h /

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install flet[all] fpdf2

      - name: Aceptar licencias de Android
        run: |
          yes | flutter doctor --android-licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compilar APK con Flet (Android 64-bit ARM64)
        run: |
          flet build apk . \
            --module-name mobile_app \
            --arch arm64-v8a \
            --yes \
            --project notaly \
            --product "Notaly" \
            --org com.notaly.app \
            --build-version 2.0.0

      - name: Firmar APK con apksigner (si los secrets estan configurados)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Secrets detectados. Decodificando Keystore y firmando APK..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
            echo "Usando apksigner ubicado en: $APKSIGNER"
            for apk in build/apk/*.apk; do
              if [ -f "$apk" ]; then
                echo "Firmando $apk..."
                $APKSIGNER sign --ks release.keystore \
                  --ks-pass "pass:$KEYSTORE_PASSWORD" \
                  --ks-key-alias "$KEY_ALIAS" \
                  --key-pass "pass:$KEY_PASSWORD" \
                  --out "${apk%.apk}-signed.apk" "$apk"
              fi
            done
            rm -f release.keystore
            echo "Firmado completado exitosamente."
          else
            echo "No se configuraron secrets de firma. Se usara el APK generado por defecto."
          fi

      - name: Subir APK como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: Notaly-Android-APK
          path: |
            build/apk/*-signed.apk
            build/apk/*.apk
          retention-days: 30
