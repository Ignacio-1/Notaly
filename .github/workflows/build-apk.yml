name: Compilar y Firmar APK Android (Notaly)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flet[all] fpdf2

      - name: Compilar APK con Flet
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Secrets de firma detectados. Configurando release.keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            flet build apk . \
              --yes \
              --project notaly \
              --product "Notaly" \
              --org com.notaly.app \
              --module-name mobile.main \
              --build-version 2.0.0 \
              --android-signing-key-store release.keystore \
              --android-signing-key-store-password "$KEYSTORE_PASSWORD" \
              --android-signing-key-alias "$KEY_ALIAS" \
              --android-signing-key-password "$KEY_PASSWORD"
            rm -f release.keystore
          else
            echo "Compilando sin secrets de firma..."
            flet build apk . \
              --yes \
              --project notaly \
              --product "Notaly" \
              --org com.notaly.app \
              --module-name mobile.main \
              --build-version 2.0.0
          fi

      - name: Subir APK como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: Notaly-Android-APK
          path: build/apk/*.apk
