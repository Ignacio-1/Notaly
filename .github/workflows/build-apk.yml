name: Compilar y Firmar APK Android (Notaly)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "flet[all]==0.23.1" fpdf2 requests Pillow

      - name: Aceptar licencias de Android
        run: |
          mkdir -p ~/.android
          echo -e "### User Sources for Android SDK Manager\n" > ~/.android/repositories.cfg

          # Aceptar todas las licencias de Android SDK
          for license in $(ls "$ANDROID_HOME/licenses/")
          do
            echo "Aceptando licencia: $license"
            echo -e "\n$license" >> "$ANDROID_HOME/licenses/android-sdk-license"
          done

          # Alternativa más confiable: crear las licencias directamente
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n504667f4c0de7973335447fc6c3b7e40efee42e8" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\n1d8aae7e54b3ecb4c15a80bda3a9edbc11a0e30b" > "$ANDROID_HOME/licenses/android-google-chrome-intel-build-tools-license"

      - name: Compilar APK con Flet (arm64-v8a)
        run: |
          flet build apk . \
            --module-name mobile_app \
            --yes \
            --project notaly \
            --product "Notaly" \
            --org com.notaly.app \
            --build-version 2.0.0 \
            --verbose

      - name: Compilar APK con Flet (x86_64)
        run: |
          flet build apk . \
            --module-name mobile_app \
            --yes \
            --project notaly \
            --product "Notaly" \
            --org com.notaly.app \
            --build-version 2.0.0 \
            --verbose

      - name: Verificar APK generado
        run: |
          ls -lah build/apk || { echo "No se generó build/apk"; exit 1; }
          find build/apk -name "*.apk" -type f

      - name: Firmar APK con apksigner (si hay secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No hay keystore configurado; no se firma."
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "No se encontró apksigner"
            exit 1
          fi

          for apk in build/apk/*.apk; do
            if [ -f "$apk" ] && [[ "$apk" != *"-signed.apk" ]]; then
              "$APKSIGNER" sign \
                --ks release.keystore \
                --ks-pass "pass:$KEYSTORE_PASSWORD" \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass "pass:$KEY_PASSWORD" \
                --out "${apk%.apk}-signed.apk" "$apk"
              rm -f "$apk"
            fi
          done

          rm -f release.keystore

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Notaly-Android-APK
          path: build/apk/*.apk
          retention-days: 30