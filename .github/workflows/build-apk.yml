name: Compilar y Firmar AAB y APK Android (Notaly)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "flet[all]==1.1.2" "fpdf2==2.9.0" "requests==2.34.2" "Pillow==13.0.0" "python-minifier==3.4.0"

      - name: Ofuscar y proteger código fuente (Anti-Reversing)
        run: |
          python scripts/obfuscate_pipeline.py

      - name: Detectar versión de Flutter requerida por Flet
        id: flet-flutter
        run: |
          FLUTTER_VER=$(python -c "import flet.version; print(flet.version.flutter_version)" 2>/dev/null || echo "3.44.8")
          if [ -z "$FLUTTER_VER" ] || [ "$FLUTTER_VER" = "0" ]; then
            FLUTTER_VER="3.44.8"
          fi
          echo "version=$FLUTTER_VER" >> $GITHUB_OUTPUT
          echo "Versión de Flutter requerida por Flet detectada: $FLUTTER_VER"

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flet-flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Aceptar licencias de Android
        run: |
          mkdir -p ~/.android
          echo -e "### User Sources for Android SDK Manager\n" > ~/.android/repositories.cfg

          for license in $(ls "$ANDROID_HOME/licenses/" 2>/dev/null || true)
          do
            echo "Aceptando licencia: $license"
            echo -e "\n$license" >> "$ANDROID_HOME/licenses/android-sdk-license"
          done

          mkdir -p "$ANDROID_HOME/licenses"
          printf "%s\n" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "84831b9409646a247e4444e66496795d4ba24124" \
            "893fb8b22d8221007e1488c767e194f47d939f5b" \
            "7c027e50ab0e962452660e45f642415a832f5313" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n504667f4c0de7973335447fc6c3b7e40efee42e8" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\n1d8aae7e54b3ecb4c15a80bda3a9edbc11a0e30b" >> "$ANDROID_HOME/licenses/android-google-chrome-intel-build-tools-license"

          yes | flutter doctor --android-licenses || true

      - name: Caché de Gradle y Wrapper Android
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2/files-2.1
          key: gradle-android-${{ runner.os }}-v3-${{ hashFiles('pyproject.toml', '.github/workflows/build-apk.yml') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-v3-
            gradle-android-${{ runner.os }}-

      - name: Configurar Gradle y optimizaciones JVM
        run: |
          mkdir -p ~/.gradle
          printf "%s\n" \
            "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" \
            "org.gradle.parallel=true" \
            "org.gradle.vfs.watch=false" \
            "systemProp.org.gradle.internal.http.socketTimeout=60000" \
            "systemProp.org.gradle.internal.http.connectionTimeout=60000" > ~/.gradle/gradle.properties

      - name: Diagnóstico de entorno Flutter y Android
        run: |
          flutter doctor -v

      - name: Limpiar compilación previa
        run: |
          rm -rf build/flutter/build 2>/dev/null || true

      - name: Compilar AAB para Google Play Store
        env:
          FLET_CLI_NO_RICH_OUTPUT: "true"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -Dorg.gradle.parallel=true -Dorg.gradle.vfs.watch=false"
        run: |
          for attempt in 1 2 3; do
            if flet build aab . \
              --module-name mobile_app \
              --project notaly \
              --product "Notaly" \
              --org com.notaly.app \
              --build-version 2.1.0 \
              --build-number 4 \
              --compile-app \
              --cleanup-app \
              --yes \
              --no-rich-output \
              -vv \
              --flutter-build-args=--verbose; then
              break
            fi
            [ "$attempt" -lt 3 ] || exit 1
            echo "Reintentando build AAB tras fallo transitorio de Gradle/Maven (intento $attempt/3)..."
            rm -rf build/flutter/build ~/.gradle/caches/modules-2/metadata-* 2>/dev/null || true
            sleep 15
          done

      - name: Limpiar build intermedio para APK
        run: |
          rm -rf build/flutter/build 2>/dev/null || true

      - name: Compilar APK para pruebas directas
        env:
          FLET_CLI_NO_RICH_OUTPUT: "true"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -Dorg.gradle.parallel=true -Dorg.gradle.vfs.watch=false"
        run: |
          for attempt in 1 2 3; do
            if flet build apk . \
              --module-name mobile_app \
              --project notaly \
              --product "Notaly" \
              --org com.notaly.app \
              --build-version 2.1.0 \
              --build-number 4 \
              --compile-app \
              --cleanup-app \
              --yes \
              --no-rich-output \
              -vv \
              --flutter-build-args=--verbose; then
              break
            fi
            [ "$attempt" -lt 3 ] || exit 1
            echo "Reintentando build APK tras fallo transitorio de Gradle/Maven (intento $attempt/3)..."
            rm -rf build/flutter/build ~/.gradle/caches/modules-2/metadata-* 2>/dev/null || true
            sleep 15
          done

      - name: Verificar binarios y compuertas de producción
        run: |
          echo "=== Archivos AAB generados ==="
          find build/aab -name "*.aab" -type f -size +0c
          echo "=== Archivos APK generados ==="
          find build/apk -name "*.apk" -type f -size +0c
          python - <<'PY'
          import io, sys, yaml, zipfile
          from pathlib import Path

          aabs = list(Path("build/aab").glob("*.aab"))
          apks = list(Path("build/apk").glob("*.apk"))
          assert aabs and apks, f"Faltan binarios: aabs={aabs}, apks={apks}"

          lock = Path("build/flutter/pubspec.lock")
          if not lock.is_file():
              lock = next(Path("build").rglob("pubspec.lock"), None)
          assert lock is not None and lock.is_file(), "No se encontro build/flutter/pubspec.lock"
          lock_data = yaml.safe_load(lock.read_text(encoding="utf-8")) or {}
          pkgs = lock_data.get("packages", {})
          assert pkgs.get("jni", {}).get("version") == "1.1.2", f"jni inesperado: {pkgs.get('jni')}"
          assert pkgs.get("jni_flutter", {}).get("version") == "1.0.4+1", f"jni_flutter inesperado: {pkgs.get('jni_flutter')}"
          print("OK pubspec.lock: jni==1.1.2 y jni_flutter==1.0.4+1")

          with zipfile.ZipFile(apks[0]) as apk_zip:
              app_zip = zipfile.ZipFile(io.BytesIO(apk_zip.read("assets/app.zip")))
              names = app_zip.namelist()

          with zipfile.ZipFile(aabs[0]) as aab_zip:
              aab_app_zip = zipfile.ZipFile(io.BytesIO(aab_zip.read("base/assets/app.zip")))
              aab_names = aab_app_zip.namelist()

          forbidden_prefixes = (
              "tests/",
              "gui/",
              "docs/",
              "design-system/",
              "scripts/",
              "dist/",
              "Output/",
              "GestorNotasEducativo_App.zip",
              "notaly-key.jks",
              "release.keystore",
              "data.json",
              "log_emulador.txt",
              "error_arranque.txt",
              "pyarmor.bug.log",
          )
          for artifact_name, entry_list in (("APK", names), ("AAB", aab_names)):
              for required in ("mobile_app.pyc", "mobile/main.pyc", "core/calculos.pyc"):
                  assert required in entry_list, f"Falta {required} en app.zip de {artifact_name}"
              leaks = [
                  n for n in entry_list
                  if n.startswith(forbidden_prefixes)
                  or ".jks" in n.lower()
                  or n.lower().endswith(".keystore")
              ]
              assert not leaks, f"Archivos prohibidos o de escritorio en {artifact_name}: {leaks[:20]}"
              print(f"OK {artifact_name} app.zip limpio ({len(entry_list)} entradas)")
          PY
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          APK_FILE=$(find build/apk -name "*.apk" -type f | head -n 1)
          if [ -z "$AAPT2" ] || [ -z "$APK_FILE" ]; then
            echo "ERROR: No se encontro aapt2 o el APK compilado para validar el manifiesto"
            exit 1
          fi
          "$AAPT2" dump permissions "$APK_FILE"
          if "$AAPT2" dump permissions "$APK_FILE" | grep -Eq "MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE"; then
            echo "ERROR: Permiso de almacenamiento externo prohibido o innecesario para Play Store"
            exit 1
          fi
          if "$AAPT2" dump xmltree "$APK_FILE" --file AndroidManifest.xml | grep -Eq 'debuggable.*(0xffffffff|true)'; then
            echo "ERROR: android:debuggable habilitado en APK release"
            exit 1
          fi

      - name: Firmar binarios (si hay secrets configurados)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No hay keystore configurado en secrets; se generan sin firmar de producción."
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          # Firmar APKs con apksigner
          if [ -n "$APKSIGNER" ]; then
            for apk in build/apk/*.apk; do
              if [ -f "$apk" ] && [[ "$apk" != *"-signed.apk" ]]; then
                "$APKSIGNER" sign \
                  --ks release.keystore \
                  --ks-pass "pass:$KEYSTORE_PASSWORD" \
                  --ks-key-alias "$KEY_ALIAS" \
                  --key-pass "pass:$KEY_PASSWORD" \
                  --out "${apk%.apk}-signed.apk" "$apk"
                rm -f "$apk"
              fi
            done
          fi

          # Firmar AABs con jarsigner (eliminando firmas previas/debug para garantizar 1 sola cadena de certificados)
          for aab in build/aab/*.aab; do
            if [ -f "$aab" ] && [[ "$aab" != *"-signed.aab" ]]; then
              zip -d "$aab" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' >/dev/null 2>&1 || true
              jarsigner \
                -keystore release.keystore \
                -storepass "$KEYSTORE_PASSWORD" \
                -keypass "$KEY_PASSWORD" \
                "$aab" "$KEY_ALIAS"
              jarsigner -verify "$aab"
              python - "$aab" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as zf:
              sig_blocks = [
                  n for n in zf.namelist()
                  if n.startswith("META-INF/") and n.upper().endswith((".RSA", ".DSA", ".EC"))
              ]
          assert len(sig_blocks) == 1, f"El AAB debe tener exactamente 1 cadena de firma: {sig_blocks}"
          print(f"OK AAB firmado con 1 cadena de certificado: {sig_blocks[0]}")
          PY
              mv "$aab" "${aab%.aab}-signed.aab"
            fi
          done

          rm -f release.keystore

      - name: Subir AAB para Google Play Store
        uses: actions/upload-artifact@v4
        with:
          name: Notaly-GooglePlay-AAB
          path: build/aab/*
          retention-days: 30

      - name: Subir APK para pruebas en dispositivos
        uses: actions/upload-artifact@v4
        with:
          name: Notaly-Android-APK
          path: build/apk/*
          retention-days: 30