[project]
name = "promediador"
version = "1.0.0"
description = "Gestor Educativo de Notas - Promediador"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyrefly]
search_path = ["."]

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = "venv"

[tool.flet]
project_name = "notaly"
product_name = "Notaly"
org_name = "com.notaly.app"
module_name = "mobile_app"
build_version = "2.0.0"

[tool.flet.app]
path = "."
module = "mobile_app"
