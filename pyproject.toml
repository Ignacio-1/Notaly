[project]
name = "promediador"
version = "1.0.0"
description = "Gestor Educativo de Notas - Promediador"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyrefly]
search_path = ["."]

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = "venv"

[tool.flet]
project_name = "notaly"
product_name = "Notaly"
org_name = "com.notaly.app"
module_name = "mobile_app"
build_version = "2.1.0"
build_number = 4

[tool.flet.app]
path = "."
module = "mobile_app"
exclude = [
    "dist",
    "Output",
    "docs",
    "design-system",
    "gui",
    "scripts",
    "tests",
    "iniciador.py",
    "main.py",
    "GestorNotas.iss",
    "GestorNotasEducativo.spec",
    "GestorNotasEducativo_App.zip",
    "app_icon.ico",
    "config_path.json",
    "cloud_auth.json",
    "data.json",
    "error_arranque.txt",
    "google49dc9b5b5960a5b1.html",
    "index.html",
    "LICENSE",
    "log_emulador.txt",
    "MEMORY.md",
    "memory.md",
    "notaly-key.jks",
    "notaly-key.jks.old",
    "plan.md",
    "privacy.html",
    "pyarmor.bug.log",
    "pytest.ini",
    "release.keystore",
    "test.pdf",
    "test_escala.pdf",
    "test_fit.pdf",
]

[tool.flet.flutter.pubspec.dependency_overrides]
jni = "1.1.2"
jni_flutter = "1.0.4+1"
